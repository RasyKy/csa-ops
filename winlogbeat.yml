# Winlogbeat -> Kafka shipper for CSA-OPS.
#
# Ships raw Sysmon events (unmodified winlog/ECS JSON) to the Kafka topic that
# engine/normalizer/consumer.py reads. Broker and topic match what is already
# hard-coded in consumer.py (KAFKA_BROKER = "localhost:9092",
# KAFKA_TOPIC = "raw-events") and the Kafka listener in docker-compose.yml
# (KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092).
#
# There is deliberately no Elasticsearch or Kibana output here: normalized
# documents are written to ES (index "logs-normalized") by consumer.py, not by
# Winlogbeat. Run this Winlogbeat 8.13.x to match the Elastic stack version in
# docker-compose.yml.

winlogbeat.event_logs:
  - name: Microsoft-Windows-Sysmon/Operational
    # Only the Sysmon event IDs consumer.py knows how to normalize
    # (EVENT_FIELD_MAPS / EVENT_TYPE_BY_CODE):
    #   1  process_start        3  network_connection   10 process_access
    #   11 file_event          12 registry_event        13 registry_event
    event_id: "1, 3, 10, 11, 12, 13"

# consumer.py does json.loads(v.decode("utf-8")) on every Kafka message, so each
# event must be emitted as a single JSON document (the Beats default codec).
output.kafka:
  hosts: ["localhost:9092"]
  topic: "raw-events"
  codec.json:
    pretty: false
  partition.round_robin:
    reachable_only: false
  required_acks: 1

logging.level: info
